spring.application.name=cafe-diary-api
spring.config.import=file:/home/ubuntu/cafe-server/.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=${PHOTO_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${PHOTO_MAX_REQUEST_SIZE:11MB}

app.aws.region=${AWS_REGION:ap-northeast-2}
app.aws.s3.bucket=${S3_BUCKET:}
app.aws.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://motoonge.kro.kr}

app.rag.base-url=${RAG_BASE_URL:http://127.0.0.1:8000}
app.rag.connect-timeout=${RAG_CONNECT_TIMEOUT:5s}
app.rag.read-timeout=${RAG_READ_TIMEOUT:210s}
